  e2e:
    needs: [vote-tests, worker-tests]
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-e2e-secret-key
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin12345

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application containers
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health/ready; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "Application failed readiness."
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run health checks
        run: bash squad-e-qa-monitoring/health-check.sh

      - name: Run end-to-end tests
        run: python3 squad-e-qa-monitoring/e2e.py

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Stop containers
        if: always()
        run: docker compose down -v
