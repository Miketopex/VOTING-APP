# =====================================================================
#  CI – every pull request and every push to a feature branch.
#  Branch protection on main requires these checks to pass.
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_call:          # re-used by cd.yml before deploying

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vote-lint-test:
    name: Vote service · lint + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vote } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: vote/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests wsgi.py
      - run: pytest -q --cov=app --cov-report=term-missing

  vote-integration:
    name: Vote service · tests on real PostgreSQL 16 + Redis 7
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vote } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: voting, POSTGRES_PASSWORD: ci, POSTGRES_DB: voting_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U voting" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://voting:ci@localhost:5432/voting_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: vote/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  worker-test:
    name: Worker · syntax check + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end · full Docker Compose stack
    runs-on: ubuntu-latest
    needs: [vote-lint-test, worker-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all 5 containers
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180
      - name: Container health
        run: docker compose -f docker-compose.dev.yml ps
      - name: Vote → Redis queue → worker → PostgreSQL → cache → results
        run: ./scripts/e2e.sh
        env:
          BASE_URL: http://localhost:8080
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: DevAdmin123
      - name: Worker health endpoint
        run: docker compose -f docker-compose.dev.yml exec -T worker wget -qO- http://127.0.0.1:8080/health
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 100
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive || echo "::warning::Run 'terraform fmt -recursive' in infra/terraform"
      - run: terraform init -backend=false
      - run: terraform validate

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Free for personal accounts. For a GitHub organisation add a free
      # GITLEAKS_LICENSE secret (gitleaks.io) or delete this job.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

