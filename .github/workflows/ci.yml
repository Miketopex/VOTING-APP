name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vote-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/cloudvote
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-key
    defaults:
      run:
        working-directory: squad-b-vote-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloudvote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: squad-b-vote-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 .
      - name: Test
        run: pytest

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squad-c-worker-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: squad-c-worker-data/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: node --test

  e2e:
    needs: [vote-tests, worker-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build containers
        if: ${{ hashFiles('squad-e-qa-monitoring/e2e.sh') != '' }}
        run: docker compose build
      - name: Run end-to-end test
        if: ${{ hashFiles('squad-e-qa-monitoring/e2e.sh') != '' }}
        run: bash squad-e-qa-monitoring/e2e.sh
