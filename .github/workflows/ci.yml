name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vote-tests:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/cloudvote
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-key

    defaults:
      run:
        working-directory: squad-b-vote-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloudvote
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - "6379:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: squad-b-vote-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 .

      - name: Test
        run: pytest

  worker-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: squad-c-worker-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: squad-c-worker-data/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: node --test

  e2e:
    needs: [vote-tests, worker-tests]
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-e2e-secret-key
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application containers
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health/ready; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "Application failed readiness."
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run health checks
        run: bash squad-e-qa-monitoring/health-check.sh

      - name: Run end-to-end tests
        run: python3 squad-e-qa-monitoring/e2e.py

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Stop containers
        if: always()
        run: docker compose down -vname: CI

