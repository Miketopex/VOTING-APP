{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back to CloudVote.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input class="input" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input class="input" type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <p class="muted small">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
