[flake8]
# F821 (undefined name) and F401 (unused import) are back on. F821 is the rule that
# catches `@api.route` when the blueprint is called `bp` - the one-line bug that
# stopped every test in this suite from running for three days.
ignore = E501, E402, E302, E303, W391
max-line-length = 120
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,venv,.venv
