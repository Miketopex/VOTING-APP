events {}

http {
    # Docker's embedded DNS. Needed because the proxy target below is a variable:
    # an `upstream` block (or a literal host in proxy_pass) is resolved ONCE, at
    # start-up, so nginx exits with "host not found in upstream" if vote-service is
    # not up yet — and never comes back. Resolving per request means nginx starts
    # regardless and simply returns 502 until the app is listening.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Real client IPs through the proxy, which the app's ProxyFix already expects.
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream":"$upstream_addr"}';
    access_log /var/log/nginx/access.log json;

    server_tokens off;

    server {
        listen 80;
        server_name _;

        # nginx's own liveness, answered without touching the app. Lets a load
        # balancer tell "nginx is down" apart from "the app behind it is down".
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $vote_upstream "vote-service:5000";
            proxy_pass http://$vote_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
